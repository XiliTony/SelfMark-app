spring:
  application:
    name: selfmark
  flyway:
    locations:
      - classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

selfmark:
  jwt:
    secret: ${SELFMARK_JWT_SECRET:}
    ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: "(local | test) & !prod"
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata
